<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Live workflow graph for local Wiff runs." />
<title>wiff</title>
<link rel="preconnect" href="https://rsms.me/" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<style>
  /* ==================================================================
     Design tokens

     One warm hue (~32deg) carries every neutral, so the "paper" feel
     comes from the ramp itself rather than a tint layered on top. Dark
     mode re-derives the same contrast steps instead of inverting.
     ================================================================== */
  :root {
    color-scheme: light;

    --paper: #faf7f2;
    --surface: #ffffff;
    --surface-sunk: #f4f0e9;
    --surface-mute: rgb(38 32 24 / 0.055);

    --ink: #1b1814;
    --ink-2: #5b544a;
    --ink-3: #8c8479;

    --line: rgb(38 32 24 / 0.09);
    --line-strong: rgb(38 32 24 / 0.16);
    --hover: rgb(38 32 24 / 0.045);
    --active: rgb(38 32 24 / 0.075);
    --overlay: rgb(27 24 20 / 0.32);

    --brand: #b8801d;
    --accent: #2b6cd4;
    --good: #0f7a4d;
    --bad: #bf432c;
    --warn: #9c6a12;
    --cached: #7b736a;
    --pending: #bcb3a7;

    --accent-bg: #e9f0fd;
    --good-bg: #e5f4ec;
    --bad-bg: #fcece8;
    --warn-bg: #fbf1dc;
    --cached-bg: #f0ece5;

    --edge: #ded7cc;

    --shadow-e1: 0 1px 2px rgb(58 44 26 / 0.06);
    --shadow-e2: 0 1px 2px rgb(58 44 26 / 0.05), 0 10px 28px -10px rgb(58 44 26 / 0.14);
    --shadow-e3: 0 2px 8px rgb(58 44 26 / 0.06), 0 28px 64px -28px rgb(58 44 26 / 0.3);

    /* Type scale — rem so it tracks the user's root size. */
    --text-2xs: 0.6875rem;
    --text-xs: 0.75rem;
    --text-sm: 0.8125rem;
    --text-md: 0.875rem;
    --text-lg: 1rem;
    --text-xl: 1.0625rem;

    /* Radii — nested surfaces derive from these with calc(), never guesses. */
    --r-card: 14px;
    --r-panel: 12px;
    --r-node: 10px;
    --r-ctl: 8px;
    --r-pill: 999px;

    --header-h: 52px;
    --sans: InterVariable, Inter, ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Geist Mono", Menlo, monospace;

    --vj-bg: var(--surface-sunk);
    --vj-bg-panel: var(--surface);
    --vj-bg-hover: var(--hover);
    --vj-bg-selected: color-mix(in srgb, var(--accent) 13%, var(--surface));
    --vj-bg-selected-muted: var(--active);
    --vj-text: var(--ink);
    --vj-text-dim: var(--ink-2);
    --vj-text-dimmer: var(--ink-3);
    --vj-text-muted: var(--ink-3);
    --vj-text-selected: var(--ink);
    --vj-border: var(--line-strong);
    --vj-border-subtle: var(--line);
    --vj-accent: var(--accent);
    --vj-accent-muted: color-mix(in srgb, var(--accent) 18%, transparent);
    --vj-string: #0a6f4d;
    --vj-number: #94550f;
    --vj-boolean: #6a4fae;
    --vj-error: var(--bad);
    --vj-font: var(--mono);
  }

  [data-theme="dark"] {
    color-scheme: dark;

    --paper: #100e0c;
    --surface: #191714;
    --surface-sunk: #141210;
    --surface-mute: rgb(247 240 230 / 0.07);

    --ink: #f6f1e9;
    --ink-2: #b4aba1;
    --ink-3: #887f75;

    --line: rgb(247 240 230 / 0.09);
    --line-strong: rgb(247 240 230 / 0.17);
    --hover: rgb(247 240 230 / 0.05);
    --active: rgb(247 240 230 / 0.09);
    --overlay: rgb(0 0 0 / 0.6);

    --brand: #e2ab48;
    --accent: #74a5f5;
    --good: #4ec48b;
    --bad: #f08d72;
    --warn: #e0a94f;
    --cached: #968d83;
    --pending: #554d45;

    --accent-bg: #182742;
    --good-bg: #123227;
    --bad-bg: #3a201a;
    --warn-bg: #382a14;
    --cached-bg: #262220;

    --edge: #3a342d;

    /* Elevation in dark mode comes from the ring, not from shadow. */
    --shadow-e1: none;
    --shadow-e2: none;
    --shadow-e3: none;

    --vj-string: #7ad9ab;
    --vj-number: #f0c079;
    --vj-boolean: #adc3f7;
  }

  /* ==================================================================
     Base
     ================================================================== */
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    font-size: var(--text-md);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Controls and copy run a notch larger on small screens, tightening up
     once there is enough room for the dense desktop reading. */
  @media (min-width: 640px) { body { font-size: var(--text-sm); } }

  button, select { font: inherit; color: inherit; }
  code, .mono, kbd { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }
  svg { display: block; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: var(--r-pill); background: var(--line-strong); background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--ink-3) 55%, transparent); background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  :where(button, select, a, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Small controls keep a 48px pointer target without growing visually. */
  .hit { display: none; }
  @media (pointer: coarse) {
    .hit {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      width: max(100%, 48px);
      height: max(100%, 48px);
      transform: translate(-50%, -50%);
    }
  }

  /* ==================================================================
     App header
     ================================================================== */
  .app-header {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: var(--header-h);
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(20px);
  }
  .app-brand {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: none;
    border-radius: var(--r-ctl);
    color: inherit;
    text-decoration: none;
  }
  .brand-mark { flex: none; fill: var(--brand); }
  .app-header h1 {
    font-size: var(--text-md);
    font-weight: 600;
    letter-spacing: -0.012em;
  }
  .app-root {
    min-width: 0;
    overflow: hidden;
    color: var(--ink-3);
    font-size: var(--text-xs);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .app-header-end { display: flex; align-items: center; gap: 8px; flex: none; margin-left: auto; }
  .live-tick {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-size: var(--text-xs);
    font-weight: 500;
    white-space: nowrap;
  }
  .live-tick:empty { display: none; }

  .icon-button {
    position: relative;
    display: grid;
    place-items: center;
    flex: none;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: var(--r-ctl);
    padding: 0;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .icon-button:hover { background: var(--hover); color: var(--ink); }
  .icon-button svg { fill: currentColor; }
  .nav-toggle[aria-expanded="true"] { background: var(--active); color: var(--ink); }
  /* The visible glyph is the mode the click switches *to*, not the current one. */
  .icon-to-light { display: none; }
  [data-theme="dark"] .icon-to-light { display: block; }
  [data-theme="dark"] .icon-to-dark { display: none; }

  /* ==================================================================
     Shell
     ================================================================== */
  .layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 0; }
  [data-nav="closed"] .layout { grid-template-columns: minmax(0, 1fr); }

  .runs-sidebar {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }
  [data-nav="closed"] .runs-sidebar { display: none; }

  .main-view {
    /* Container for the workflow view so it reflows on sidebar collapse, not just window resize. */
    container: stage / inline-size;
    isolation: isolate;
    min-width: 0;
    overflow-y: auto;
    background: var(--paper);
  }

  /* ==================================================================
     Sidebar — filters
     ================================================================== */
  .side-tools {
    display: grid;
    flex: none;
    gap: 7px;
    padding: 9px 10px 10px;
    border-bottom: 1px solid var(--line);
  }
  .filter-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 24px;
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 2px 7px 2px 6px;
    background: transparent;
    color: var(--ink-3);
    font-size: var(--text-2xs);
    line-height: 1.4;
    cursor: pointer;
  }
  .chip:hover { background: var(--hover); }
  .chip .dot { animation: none; }
  .chip[aria-pressed="false"] .dot { opacity: 0.4; }
  .chip-count { font-variant-numeric: tabular-nums; opacity: 0.75; }
  .chip[aria-pressed="true"] { border-color: transparent; }
  .chip[aria-pressed="true"][data-status="running"] { color: var(--accent); background: var(--accent-bg); }
  .chip[aria-pressed="true"][data-status="completed"] { color: var(--good); background: var(--good-bg); }
  .chip[aria-pressed="true"][data-status="failed"] { color: var(--bad); background: var(--bad-bg); }
  .chip[aria-pressed="true"][data-status="cancelled"],
  .chip[aria-pressed="true"][data-status="interrupted"] { color: var(--warn); background: var(--warn-bg); }

  .side-tools-row { display: flex; align-items: center; gap: 6px; }
  .select-wrap { display: inline-grid; grid-template-columns: 1fr 22px; align-items: center; }
  .select-wrap select {
    grid-column: 1 / -1;
    grid-row: 1;
    appearance: none;
    min-height: 26px;
    border: 1px solid var(--line);
    border-radius: var(--r-ctl);
    padding: 2px 22px 2px 8px;
    background: var(--surface);
    color: var(--ink-2);
    font-size: var(--text-2xs);
    cursor: pointer;
  }
  .select-wrap select:hover { background: var(--hover); }
  .select-wrap svg { grid-column: 2; grid-row: 1; place-self: center; fill: var(--ink-3); pointer-events: none; }
  .side-count {
    margin-left: auto;
    color: var(--ink-3);
    font-size: var(--text-2xs);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .text-button {
    border: 0;
    border-radius: var(--r-ctl);
    padding: 3px 7px;
    background: transparent;
    color: var(--accent);
    font-size: var(--text-2xs);
    cursor: pointer;
  }
  .text-button:hover { background: var(--hover); }

  /* ==================================================================
     Sidebar — run list
     ================================================================== */
  .side-list {
    display: grid;
    flex: 1;
    align-content: start;
    gap: 1px;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 6px 24px;
  }
  .side-h {
    padding: 12px 8px 4px;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: var(--text-2xs);
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .side-list > .side-h:first-child { padding-top: 4px; }

  .run-item { position: relative; border-radius: var(--r-panel); color: var(--ink); }
  .run-item:hover { background: var(--hover); }
  .run-item.selected { background: var(--active); }
  .run-main {
    display: grid;
    gap: 3px;
    width: 100%;
    border: 0;
    border-radius: var(--r-panel);
    padding: 8px 28px 8px 8px;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .run-title {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .run-name {
    min-width: 0;
    overflow: hidden;
    font-size: var(--text-sm);
    font-weight: 550;
    letter-spacing: -0.008em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .run-time {
    flex: none;
    color: var(--ink-3);
    font-size: var(--text-2xs);
    font-variant-numeric: tabular-nums;
  }
  .run-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    padding-left: 15px;
    overflow: hidden;
  }
  .run-stats {
    display: flex;
    gap: 8px;
    min-width: 0;
    overflow: hidden;
    color: var(--ink-3);
    font-size: var(--text-2xs);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .run-stats .done { color: var(--good); }
  .run-stats .failed { color: var(--bad); }
  .run-stats .cached { color: var(--cached); }
  .run-live {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding-left: 15px;
    color: var(--ink-2);
    font-size: var(--text-2xs);
  }
  .run-live .dot { width: 5px; height: 5px; }
  .run-live-label {
    flex: none;
    max-width: 46%;
    overflow: hidden;
    font-weight: 500;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .run-live-doing {
    min-width: 0;
    overflow: hidden;
    color: var(--ink-3);
    font-family: var(--mono);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .run-pin {
    position: absolute;
    top: 6px;
    right: 6px;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: var(--r-ctl);
    padding: 0;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    opacity: 0;
  }
  .run-item:hover .run-pin,
  .run-item:focus-within .run-pin,
  .run-pin[aria-pressed="true"] { opacity: 1; }
  .run-pin:hover { background: var(--active); color: var(--ink-2); }
  .run-pin[aria-pressed="true"] { color: var(--brand); }
  .run-pin svg { fill: currentColor; }
  @media (pointer: coarse) {
    .run-pin { opacity: 0.55; }
    .run-pin[aria-pressed="true"] { opacity: 1; }
  }

  /* ==================================================================
     Status primitives
     ================================================================== */
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
  .dot.running { background: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
  .dot.queued { border: 1px solid var(--accent); background: transparent; }
  .dot.completed { background: var(--good); }
  .dot.failed { background: var(--bad); }
  .dot.cached { background: var(--cached); }
  .dot.cancelled, .dot.interrupted, .dot.stalled { background: var(--warn); }
  .dot.pending { border: 1px solid var(--pending); background: transparent; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex: none;
    border-radius: var(--r-pill);
    padding: 1px 7px 1px 5px;
    font-size: var(--text-2xs);
    font-weight: 500;
    line-height: 1.5;
    white-space: nowrap;
  }
  .pill .dot { width: 5px; height: 5px; }
  .pill.running, .pill.queued { color: var(--accent); background: var(--accent-bg); }
  .pill.completed { color: var(--good); background: var(--good-bg); }
  .pill.failed { color: var(--bad); background: var(--bad-bg); }
  .pill.cancelled, .pill.interrupted, .pill.stalled { color: var(--warn); background: var(--warn-bg); }
  .pill.cached { color: var(--cached); background: var(--cached-bg); }

  /* ==================================================================
     Workflow card
     ================================================================== */
  .workflow-shell {
    --shell-pad: clamp(14px, 2vw, 26px);
    width: min(100%, 1440px);
    margin-inline: auto;
    padding: var(--shell-pad);
  }
  .workflow-card {
    overflow: hidden;
    border-radius: var(--r-card);
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--line), var(--shadow-e2);
  }
  .workflow-titlebar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
  }
  .workflow-symbol { flex: none; fill: var(--brand); }
  .workflow-heading { min-width: 0; flex: 1; }
  .workflow-heading h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-size: var(--text-xl);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .workflow-title {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .workflow-attempt { flex: none; color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
  .workflow-description {
    max-width: 78ch;
    margin-top: 2px;
    overflow: hidden;
    color: var(--ink-2);
    font-size: var(--text-xs);
    text-overflow: ellipsis;
    text-wrap: pretty;
    white-space: nowrap;
  }
  .workflow-owner {
    display: flex;
    align-items: center;
    gap: 7px;
    flex: none;
    color: var(--ink-2);
    font-size: var(--text-xs);
  }
  .workflow-owner .label { color: var(--ink-3); }
  .owner-name {
    max-width: 18ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .owner-monogram {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    outline: 1px solid var(--line-strong);
    outline-offset: -1px;
    background: var(--surface-mute);
    color: var(--ink-2);
    font-size: var(--text-2xs);
    font-weight: 600;
  }
  .workflow-error {
    display: flex;
    gap: 8px;
    padding: 9px 16px;
    border-bottom: 1px solid color-mix(in srgb, var(--bad) 20%, transparent);
    background: var(--bad-bg);
    color: var(--bad);
    font-size: var(--text-xs);
    word-break: break-word;
  }
  .workflow-error svg { flex: none; margin-top: 1px; fill: currentColor; }

  /* ==================================================================
     Flow graph
     ================================================================== */
  .flow-viewport {
    position: relative;
    min-height: 240px;
    overflow: auto;
    overscroll-behavior: contain;
    background: var(--surface-sunk);
  }
  .flow-stage {
    position: relative;
    width: max(100%, var(--stage-width));
    padding: 22px 26px 34px;
  }
  .flow-edges { position: absolute; inset: 0; z-index: 1; overflow: visible; pointer-events: none; }
  .flow-edge {
    fill: none;
    stroke: var(--edge);
    stroke-width: 1.5;
    stroke-linecap: round;
  }
  .flow-edge.completed { stroke: color-mix(in srgb, var(--good) 26%, var(--edge)); }
  .flow-edge.failed { stroke: color-mix(in srgb, var(--bad) 38%, var(--edge)); }
  .flow-edge.cached { stroke: color-mix(in srgb, var(--cached) 38%, var(--edge)); }
  .flow-edge.running {
    stroke: color-mix(in srgb, var(--accent) 60%, var(--edge));
    stroke-dasharray: 6 6;
    animation: edge-flow 1.2s linear infinite;
  }
  .flow-edge.queued { stroke: color-mix(in srgb, var(--accent) 30%, var(--edge)); stroke-dasharray: 2 7; }
  @keyframes edge-flow { to { stroke-dashoffset: -12; } }
  @keyframes rail-flow { to { background-position: 0 14px; } }

  .flow-grid {
    /* Read by JS (isStacked) so connector math and CSS never disagree about the orientation. */
    --flow-mode: columns;
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(var(--phase-count), minmax(200px, 1fr));
    align-items: start;
    gap: 64px;
  }
  .phase-column { min-width: 0; }
  .phase-heading {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 22px;
    margin-bottom: 14px;
    color: var(--ink-2);
    font-size: var(--text-xs);
  }
  .phase-index {
    flex: none;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: var(--text-2xs);
    font-variant-numeric: tabular-nums;
  }
  .phase-name {
    min-width: 0;
    overflow: hidden;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .phase-count {
    flex: none;
    border-radius: var(--r-pill);
    padding: 0 6px;
    background: var(--surface-mute);
    color: var(--ink-3);
    font-size: var(--text-2xs);
    font-variant-numeric: tabular-nums;
  }
  .phase-mode {
    flex: none;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: var(--text-2xs);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .phase-hub {
    width: 8px;
    height: 8px;
    margin: 0 auto;
    border: 2px solid var(--pending);
    border-radius: 50%;
    background: var(--surface-sunk);
  }
  .phase-nodes { display: grid; min-width: 0; gap: 10px; }
  .phase-empty {
    max-width: 248px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--r-node);
    padding: 14px 12px;
    color: var(--ink-3);
    font-size: var(--text-xs);
    text-align: center;
  }

  /* ==================================================================
     Agent node

     Every part of an agent lives on one surface. Previously the label sat
     in a chip while the model, tags and live line floated loose on the
     canvas beneath it, which read as four unrelated fragments per agent.
     ================================================================== */
  .agent-node {
    --node-pad: 9px;
    display: grid;
    gap: 5px;
    width: 100%;
    min-width: 0;
    max-width: 264px;
    border: 0;
    border-radius: var(--r-node);
    padding: var(--node-pad) 10px;
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--line), var(--shadow-e1);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .agent-node:hover { background: color-mix(in srgb, var(--surface) 97%, var(--ink)); }
  .agent-node:disabled { cursor: default; }
  .agent-node:disabled:hover { background: var(--surface); }
  .agent-node.running { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, var(--line)), var(--shadow-e1); }
  .agent-node.queued { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 22%, var(--line)), var(--shadow-e1); }
  .agent-node.failed { box-shadow: 0 0 0 1px color-mix(in srgb, var(--bad) 40%, var(--line)), var(--shadow-e1); }
  .agent-node.goal.running,
  .agent-node.goal.queued { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 46%, var(--line)), var(--shadow-e1); }

  .agent-node-main {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .node-status {
    display: grid;
    place-items: center;
    flex: none;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--pending);
    border-radius: 50%;
    color: var(--pending);
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
  }
  .node-status.completed { border-color: var(--good); background: var(--good); color: var(--surface); }
  .node-status.failed { border-color: var(--bad); background: var(--bad); color: var(--surface); }
  .node-status.cached { border-color: var(--cached); color: var(--cached); }
  .node-status.running { border-color: var(--accent); color: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
  .node-status.queued { border-color: var(--accent); color: var(--accent); }
  .node-label {
    min-width: 0;
    overflow: hidden;
    font-size: var(--text-sm);
    font-weight: 550;
    letter-spacing: -0.008em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .goal-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex: none;
    border-radius: calc(var(--r-node) - var(--node-pad) + 3px);
    padding: 1px 5px 1px 4px;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: var(--text-2xs);
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
  }
  .agent-node.completed .goal-badge { background: var(--good-bg); color: var(--good); }
  .agent-node.failed .goal-badge { background: var(--bad-bg); color: var(--bad); }
  .agent-node.cached .goal-badge { background: var(--cached-bg); color: var(--cached); }

  .node-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding-left: 24px;
    color: var(--ink-2);
    font-size: var(--text-2xs);
  }
  .agent-orb {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }
  .tone-0 { background: #2bab95; }
  .tone-1 { background: #6f63d8; }
  .tone-2 { background: #d43b7c; }
  .tone-3 { background: #3d80cf; }
  .tone-4 { background: #cf7c2c; }
  [data-theme="dark"] .tone-0 { background: #4fd1b8; }
  [data-theme="dark"] .tone-1 { background: #9b8cf5; }
  [data-theme="dark"] .tone-2 { background: #f472a6; }
  [data-theme="dark"] .tone-3 { background: #6faaf0; }
  [data-theme="dark"] .tone-4 { background: #f0a45c; }
  .node-owner-label {
    min-width: 0;
    overflow: hidden;
    font-family: var(--mono);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .node-duration {
    flex: none;
    margin-left: auto;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .node-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding-left: 24px;
  }
  .node-tag {
    flex: none;
    border-radius: calc(var(--r-node) - var(--node-pad) + 3px);
    padding: 0 5px;
    background: var(--surface-mute);
    color: var(--ink-3);
    font-size: var(--text-2xs);
    line-height: 1.6;
    white-space: nowrap;
  }
  .node-tag.effort { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .node-tag.worktree { background: var(--warn-bg); color: var(--warn); }
  .node-activity {
    min-width: 0;
    padding-left: 24px;
    overflow: hidden;
    color: var(--ink-2);
    font-family: var(--mono);
    font-size: var(--text-2xs);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .node-activity:empty { display: none; }
  .node-error {
    min-width: 0;
    padding-left: 24px;
    overflow: hidden;
    color: var(--bad);
    font-size: var(--text-2xs);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .flow-focus {
    position: absolute;
    left: 14px;
    bottom: 14px;
    z-index: 4;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: var(--r-ctl);
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    box-shadow: 0 0 0 1px var(--line), var(--shadow-e1);
    color: var(--ink-2);
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  .flow-focus:hover { background: var(--surface); color: var(--ink); }
  .flow-focus svg { fill: currentColor; }

  /* ==================================================================
     Progress footer
     ================================================================== */
  .workflow-progress {
    display: grid;
    grid-template-columns: auto minmax(80px, 1fr) auto;
    grid-template-areas: "label track summary";
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .progress-label { grid-area: label; color: var(--ink-3); font-size: var(--text-xs); }
  .progress-now {
    grid-area: now;
    display: none;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: var(--text-2xs);
  }
  .progress-now[hidden] { display: none; }
  .progress-now b { flex: none; max-width: 46%; overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .progress-now-text {
    min-width: 0;
    overflow: hidden;
    color: var(--ink-3);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .progress-now-more { flex: none; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* Per-step segments read as one bar at a glance and still keep each
     step's own status legible on hover. */
  .progress-track {
    grid-area: track;
    display: flex;
    align-items: center;
    gap: 2px;
    min-width: 0;
    overflow: hidden;
  }
  .seg {
    flex: 1 1 0;
    min-width: 4px;
    max-width: 22px;
    height: 6px;
    border-radius: 2px;
    background: var(--surface-mute);
  }
  .seg.completed { background: var(--good); }
  /* Replayed steps are "done" but shouldn't compete with real work for
     attention, so they read as a lighter fill rather than a second colour. */
  .seg.cached { background: color-mix(in srgb, var(--cached) 42%, transparent); }
  .seg.failed { background: var(--bad); }
  .seg.running { background: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
  .seg.queued { background: color-mix(in srgb, var(--accent) 34%, transparent); }
  .seg.cancelled, .seg.interrupted, .seg.stalled { background: var(--warn); }
  .seg.pending { background: var(--surface-mute); }
  .progress-more { flex: none; color: var(--ink-3); font-size: var(--text-2xs); font-variant-numeric: tabular-nums; }

  .progress-summary {
    grid-area: summary;
    display: flex;
    align-items: baseline;
    gap: 12px;
    color: var(--ink-3);
    font-size: var(--text-2xs);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .progress-summary strong { color: var(--ink); font-size: var(--text-md); font-weight: 600; }
  /* Reads as a projection, not a measurement — the accent keeps it visibly
     distinct from the elapsed time sitting next to it. */
  .progress-eta { color: var(--accent); }
  .progress-eta:empty { display: none; }

  /* ==================================================================
     Run context + support panels
     ================================================================== */
  .run-context {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    padding: 14px 4px 0;
    font-size: var(--text-2xs);
  }
  .run-context > div { display: flex; gap: 6px; min-width: 0; }
  .run-context dt { flex: none; color: var(--ink-3); }
  .run-context dd {
    min-width: 0;
    overflow: hidden;
    color: var(--ink-2);
    font-weight: 500;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .run-context .path { max-width: 56ch; }

  /* One column by default — most runs only have the Activity panel, and a
     fixed 2-up left it stranded in the left half with dead space beside it.
     The second column only appears when there is a second panel to fill it. */
  .support-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    margin-top: 14px;
  }
  .support-grid:has(#kept-worktrees) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .support-panel {
    min-width: 0;
    overflow: hidden;
    border-radius: var(--r-panel);
    background: var(--surface-sunk);
    box-shadow: 0 0 0 1px var(--line);
  }
  .support-panel.wide { grid-column: 1 / -1; }
  .support-panel > h3,
  .support-panel > summary {
    padding: 9px 12px;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: var(--text-2xs);
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .support-panel > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    list-style: none;
  }
  .support-panel > summary::-webkit-details-marker { display: none; }
  .support-panel > summary::before {
    content: "";
    width: 0;
    height: 0;
    border-top: 3.5px solid transparent;
    border-bottom: 3.5px solid transparent;
    border-left: 5px solid currentColor;
  }
  .support-panel[open] > summary::before {
    border-top: 5px solid currentColor;
    border-right: 3.5px solid transparent;
    border-bottom: 0;
    border-left: 3.5px solid transparent;
  }
  .support-panel > summary:hover { color: var(--ink-2); }
  .feed { border-top: 1px solid var(--line); font-size: var(--text-2xs); }
  .feed > div { display: flex; gap: 10px; min-width: 0; padding: 6px 12px; }
  .feed > div + div { border-top: 1px solid var(--line); }
  .feed .t { flex: none; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .feed .phase-ev { color: var(--accent); font-weight: 500; }
  .feed .value { min-width: 0; overflow: hidden; color: var(--ink-2); text-overflow: ellipsis; white-space: nowrap; }
  .worktree-list > div { display: grid; grid-template-columns: minmax(90px, auto) 1fr; }
  .worktree-list .path { min-width: 0; overflow: hidden; color: var(--ink-3); text-overflow: ellipsis; white-space: nowrap; }
  pre.result {
    max-height: 320px;
    overflow: auto;
    border-top: 1px solid var(--line);
    padding: 12px;
    font-size: var(--text-xs);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .empty {
    padding: 44px 20px;
    color: var(--ink-3);
    font-size: var(--text-xs);
    text-align: center;
    text-wrap: pretty;
  }
  .feed .empty { border-top: 1px solid var(--line); padding: 20px; }
  .empty .text-button { margin-top: 6px; }

  /* ==================================================================
     Overlays — nav sheet + transcript drawer
     ================================================================== */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: none;
    border: 0;
    padding: 0;
    background: var(--overlay);
  }
  .sheet-backdrop.open { display: block; }
  #nav-backdrop { z-index: 7; }

  .drawer {
    position: fixed;
    inset: 0 0 0 auto;
    z-index: 10;
    display: none;
    flex-direction: column;
    width: min(640px, 92vw);
    border-left: 1px solid var(--line-strong);
    background: var(--surface);
    box-shadow: var(--shadow-e3);
  }
  .drawer.open { display: flex; }
  .drawer-header {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: var(--header-h);
    padding: 8px 10px 8px 16px;
    border-bottom: 1px solid var(--line);
  }
  .drawer-header h1 {
    min-width: 0;
    overflow: hidden;
    font-size: var(--text-sm);
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .drawer-meta { flex: none; color: var(--ink-3); font-size: var(--text-2xs); white-space: nowrap; }
  .drawer-live {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex: none;
    margin-left: auto;
    color: var(--accent);
    font-size: var(--text-2xs);
    white-space: nowrap;
  }
  .drawer-live:empty { display: none; }
  .drawer .body { flex: 1; overflow-y: auto; padding: 14px 16px; }

  .tr-event { margin-bottom: 10px; }
  .tr-event .m { color: var(--ink-3); font-size: var(--text-2xs); font-variant-numeric: tabular-nums; }
  .tr-event pre,
  .tr-event .vj-tree {
    margin-top: 4px;
    border-radius: var(--r-ctl);
    padding: 8px 10px;
    background: var(--surface-sunk);
    box-shadow: 0 0 0 1px var(--line);
    font-size: var(--text-xs);
  }
  .tr-event pre { white-space: pre-wrap; word-break: break-word; }
  .tr-event .vj-tree { max-height: 420px; overflow: auto; }

  /* ==================================================================
     Embedded panel mode.

     Two independent axes:
       - viewport width  -> where the run list lives (page-level shell)
       - .main-view width -> how the workflow itself lays out (component)
     The second is a container query so collapsing the sidebar reflows the
     graph immediately, without waiting for a window resize.
     ================================================================== */

  /* Shell: the run list becomes an overlay disclosure. A horizontal strip
     would cost ~130px of the panel's scarcest resource, its height. */
  @media (max-width: 940px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .runs-sidebar {
      position: fixed;
      inset: var(--header-h) auto 0 0;
      z-index: 8;
      width: min(320px, 88vw);
      box-shadow: var(--shadow-e3);
      transition: transform 180ms ease, visibility 180ms;
    }
    [data-nav="closed"] .runs-sidebar {
      display: flex;
      transform: translateX(-100%);
      visibility: hidden;
    }
    [data-nav="open"] #nav-backdrop { display: block; }
  }

  @media (max-width: 820px) {
    .app-header { gap: 8px; padding-inline: 8px; }
    .app-root { display: none; }
    .drawer { width: 100%; border-left: 0; }
    .drawer-header { gap: 8px; padding: 8px; }
    .drawer-meta { display: none; }
    .drawer .body { padding: 12px; }
  }

  /* Workflow view: stack phases down a rail instead of scrolling sideways.
     Columns only earn their keep once ~3 of them fit at once; below that
     the sideways scroll hides more than the layout shows. */
  @container stage (max-width: 860px) {
    .flow-grid { --flow-mode: stacked; grid-template-columns: minmax(0, 1fr); gap: 0; }
    .workflow-shell { padding: 0 0 14px; }
    .workflow-card {
      overflow: visible; /* required for the sticky title/progress bars */
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .workflow-titlebar {
      position: sticky;
      top: 0;
      z-index: 4;
      gap: 10px;
      padding: 8px 10px;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(20px);
    }
    .workflow-symbol,
    .workflow-owner,
    .flow-focus { display: none; }
    .titlebar-focus { display: grid; }
    .workflow-heading h2 { gap: 6px; font-size: var(--text-lg); }
    .workflow-description {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      white-space: normal;
    }
    .workflow-error { padding-inline: 10px; }

    .flow-viewport { min-height: 0; overflow: visible; background: transparent; }
    .flow-stage { width: 100%; padding: 10px 10px 4px; }
    .flow-edges { display: none; }

    .phase-column { position: relative; padding: 0 0 14px 20px; }
    .phase-column::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: 0;
      left: 5px;
      width: 2px;
      border-radius: var(--r-pill);
      background: var(--edge);
    }
    .phase-column:last-child::before { bottom: 20px; }
    .phase-column[data-status="completed"]::before,
    .phase-column[data-status="cached"]::before { background: color-mix(in srgb, var(--good) 32%, var(--edge)); }
    .phase-column[data-status="failed"]::before { background: color-mix(in srgb, var(--bad) 40%, var(--edge)); }
    .phase-column[data-status="running"]::before,
    .phase-column[data-status="queued"]::before {
      background: repeating-linear-gradient(
        180deg,
        color-mix(in srgb, var(--accent) 60%, var(--edge)) 0 7px,
        transparent 7px 14px
      );
      animation: rail-flow 1.2s linear infinite;
    }
    .phase-column[data-status="queued"]::before { animation: none; opacity: 0.55; }
    .phase-heading { min-height: 20px; margin-bottom: 8px; }
    .phase-hub {
      position: absolute;
      top: 4px;
      left: 0;
      width: 12px;
      height: 12px;
      margin: 0;
      background: var(--paper);
    }
    .phase-column[data-status="completed"] .phase-hub,
    .phase-column[data-status="cached"] .phase-hub { border-color: var(--good); }
    .phase-column[data-status="failed"] .phase-hub { border-color: var(--bad); }
    .phase-column[data-status="running"] .phase-hub,
    .phase-column[data-status="queued"] .phase-hub { border-color: var(--accent); }
    .phase-nodes { gap: 6px; }
    .phase-empty { max-width: none; padding: 10px 12px; text-align: left; }

    /* Full width is available here, so wrap instead of ellipsis — the columnar
       264px node had to clip "design:caps+headless+timeout" to "…headles…". */
    .agent-node { max-width: none; }
    .node-label {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      white-space: normal;
    }

    .workflow-progress {
      position: sticky;
      bottom: 0;
      z-index: 4;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "now now" "track summary";
      gap: 5px 10px;
      padding: 7px 10px;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(20px);
    }
    .progress-label { display: none; }
    .progress-now { display: flex; }
    .progress-summary { gap: 10px; }

    .run-context { padding: 12px 10px 0; }
    .run-context .path { max-width: 100%; }
    .support-grid { grid-template-columns: minmax(0, 1fr); margin-inline: 10px; }
    .support-panel.wide { grid-column: auto; }
  }

  /* The jump-to-active control lives in the titlebar once the floating
     button is out of the picture. */
  .titlebar-focus { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .dot.running,
    .seg.running,
    .node-status.running,
    .flow-edge.running,
    .phase-column::before { animation: none; }
    .runs-sidebar { transition: none; }
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<header class="app-header">
  <button class="icon-button nav-toggle" id="nav-toggle" type="button" aria-expanded="true" aria-controls="runs-sidebar">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4.75A.75.75 0 0 1 2.75 4h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 4.75ZM2 8a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 8Zm0 3.25a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1-.75-.75Z"/></svg>
    <span class="sr-only">Toggle run list</span>
    <span class="hit" aria-hidden="true"></span>
  </button>
  <a class="app-brand" href="/" aria-label="Homepage">
    <svg class="brand-mark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 .8 15.2 8 8 15.2.8 8 8 .8Zm0 3.02L3.82 8 8 12.18 12.18 8 8 3.82Z"/></svg>
    <h1>wiff</h1>
  </a>
  <span class="app-root mono" id="root"></span>
  <div class="app-header-end">
    <span class="live-tick" id="tick"></span>
    <button class="icon-button" id="theme" type="button" aria-label="Toggle theme">
      <svg class="icon-to-dark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M14.2 9.6A6.5 6.5 0 1 1 6.4 1.8 6.5 6.5 0 0 0 14.2 9.6Z"/></svg>
      <svg class="icon-to-light" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-9.75a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-1.5 0V2a.75.75 0 0 1 .75-.75Zm0 11a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-1.5 0V13a.75.75 0 0 1 .75-.75ZM14.75 8a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1 0-1.5h.5a.75.75 0 0 1 .75.75Zm-11 0a.75.75 0 0 1-.75.75H2.5a.75.75 0 0 1 0-1.5H3a.75.75 0 0 1 .75.75Zm9.02-4.77a.75.75 0 0 1 0 1.06l-.36.36a.75.75 0 0 1-1.06-1.07l.35-.35a.75.75 0 0 1 1.07 0ZM4.65 11.35a.75.75 0 0 1 0 1.06l-.36.36a.75.75 0 0 1-1.06-1.06l.35-.36a.75.75 0 0 1 1.07 0Zm8.12 1.42a.75.75 0 0 1-1.07 0l-.35-.36a.75.75 0 1 1 1.06-1.06l.36.36a.75.75 0 0 1 0 1.06ZM4.65 4.65a.75.75 0 0 1-1.07 0l-.35-.36a.75.75 0 0 1 1.06-1.06l.36.35a.75.75 0 0 1 0 1.07Z"/></svg>
    </button>

<div class="layout">
  <aside class="runs-sidebar" id="runs-sidebar" aria-label="Workflow runs">
    <div class="side-tools">
      <div class="filter-row" id="status-filters" role="group" aria-label="Filter runs by status"></div>
      <div class="side-tools-row">

          <select id="launched-filter" name="launched" aria-label="Filter by last launched">
            <option value="all">Any time</option>

            <option value="7d">Last 7 days</option>
            <option value="30d">Last 30 days</option>
          </select>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z"/></svg>
        </span>
        <button class="text-button" id="filters-reset" type="button" hidden>Reset</button>
        <span class="side-count" id="side-count"></span>
      </div>
    </div>
    <div class="side-list" id="runs"></div>

<button class="sheet-backdrop" id="nav-backdrop" type="button" aria-label="Close run list"></button>
<button class="sheet-backdrop" id="backdrop" type="button" aria-label="Close transcript"></button>

  <header class="drawer-header">
    <h1 id="drawer-title" class="mono"></h1>

    <span class="drawer-live" id="drawer-live"></span>
    <button class="icon-button" id="drawer-close" type="button" aria-label="Close transcript">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.22 2.22a.75.75 0 0 1 1.06 0L8 6.94l4.72-4.72a.75.75 0 1 1 1.06 1.06L9.06 8l4.72 4.72a.75.75 0 1 1-1.06 1.06L8 9.06l-4.72 4.72a.75.75 0 0 1-1.06-1.06L6.94 8 2.22 3.28a.75.75 0 0 1 0-1.06Z"/></svg>
      <span class="hit" aria-hidden="true"></span>
    </button>
  </header>
  <div class="body" id="drawer-body"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let selectedRunId = null;
let runsCache = [];
let detail = null;
let structureKey = "";
let agentsIndex = new Map();
let drawer = null;
let activeAgents = [];
let visualJsonPromise = null;
let visualJsonUnavailable = false;
let visualJsonRoots = [];

function ensureVisualJson() {
  if (visualJsonUnavailable) return Promise.resolve(null);
  if (!visualJsonPromise) {
    visualJsonPromise = Promise.all([
      import("https://esm.sh/react@19.2.0"),
      import("https://esm.sh/react-dom@19.2.0/client?deps=react@19.2.0"),
      import("https://esm.sh/@visual-json/react@0.4.0?deps=react@19.2.0"),
    ]).then(([React, ReactDom, VisualJsonModule]) => ({
      createElement: React.createElement,
      createRoot: ReactDom.createRoot,
      VisualJson: VisualJsonModule.VisualJson,
      TreeView: VisualJsonModule.TreeView,
    })).catch(() => {
      visualJsonUnavailable = true;
      return null;
    });
  }
  return visualJsonPromise;
}

function unmountVisualJsonRoots() {
  for (const root of visualJsonRoots) {
    try { root.unmount(); } catch {}
  }
  visualJsonRoots = [];
}

const savedTheme = localStorage.getItem("cwf-theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
$("theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("cwf-theme", next);
  requestAnimationFrame(drawConnectors);
};

// Below this width the run list is an overlay rather than a docked column.
const navOverlay = matchMedia("(max-width: 940px)");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

function setNav(open, { persist = true } = {}) {
  document.documentElement.dataset.nav = open ? "open" : "closed";
  $("nav-toggle").setAttribute("aria-expanded", String(open));
  $("nav-backdrop").classList.toggle("open", open && navOverlay.matches);
  // Docked/collapsed is a preference worth keeping; the overlay always reopens closed.
  if (persist && !navOverlay.matches) store.save("cwf-nav-docked", open);
  requestAnimationFrame(drawConnectors);
}

const navOpen = () => document.documentElement.dataset.nav === "open";
function syncNavToWidth() {
  setNav(navOverlay.matches ? false : store.load("cwf-nav-docked", true) !== false, { persist: false });
}

const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (character) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
}[character]));
const fmtDur = (ms) => {
  if (ms == null || Number.isNaN(ms)) return "";
  if (ms < 1000) return `${Math.round(ms)}ms`;
  if (ms < 60_000) return `${(ms / 1000).toFixed(1)}s`;
  return `${Math.floor(ms / 60_000)}m ${Math.round((ms % 60_000) / 1000)}s`;
};
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "");
const fmtClock = (iso) => (iso ? new Date(iso).toLocaleTimeString() : "");
const fmtTokens = (number) => new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(number);
const STATUS_ICON = { queued: "", running: "", completed: "✓", failed: "✕", cached: "↻", cancelled: "–", interrupted: "Ⅱ", stalled: "!", pending: "" };
const KIND_ICON = { exec: "›", edit: "✎", thinking: "…", message: "·", search: "⌕", tool: "⌘" };
const pill = (status) => `<span class="pill ${esc(status)}"><span class="dot ${esc(status)}" aria-hidden="true"></span>${esc(status)}</span>`;
const nowLine = (activity) => (activity ? `${KIND_ICON[activity.kind] ?? "·"} ${activity.text}` : "");
const slugify = (value) => String(value ?? "phase").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "phase";
const displayRunStatus = (run) =>
  run.status === "running" && run.ownerResponsive === false ? "stalled" : run.status;

const STATUS_FILTERS = ["running", "completed", "failed", "cancelled", "interrupted"];
const LAUNCHED_WINDOWS = { all: Number.POSITIVE_INFINITY, "24h": 86_400_000, "7d": 604_800_000, "30d": 2_592_000_000 };
const store = {
  load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  },
  save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ }
  },
};
const savedFilters = store.load("cwf-run-filters", {});
const filters = {
  statuses: Array.isArray(savedFilters.statuses)
    ? savedFilters.statuses.filter((status) => STATUS_FILTERS.includes(status))
    : [...STATUS_FILTERS],
  launched: savedFilters.launched in LAUNCHED_WINDOWS ? savedFilters.launched : "all",
};
let pins = store.load("cwf-run-pins", []);
if (!Array.isArray(pins)) pins = [];

const filtersActive = () => filters.launched !== "all" || filters.statuses.length < STATUS_FILTERS.length;

function visibleRuns() {
  const window = LAUNCHED_WINDOWS[filters.launched] ?? Number.POSITIVE_INFINITY;
  const now = Date.now();
  return runsCache.filter((run) => filters.statuses.includes(run.status) && now - +new Date(run.startedAt) <= window);
}

function buildFilterBar() {
  $("status-filters").innerHTML = STATUS_FILTERS.map((status) => `<button class="chip" type="button"
      data-status="${status}" aria-pressed="${filters.statuses.includes(status)}">
    <span class="dot ${status}" aria-hidden="true"></span>${status}<span class="chip-count" data-count-for="${status}">0</span>
  </button>`).join("");
  $("launched-filter").value = filters.launched;
}

function updateFilterBar() {
  const window = LAUNCHED_WINDOWS[filters.launched] ?? Number.POSITIVE_INFINITY;
  const now = Date.now();
  const pool = runsCache.filter((run) => now - +new Date(run.startedAt) <= window);
  for (const status of STATUS_FILTERS) {
    const count = $("status-filters").querySelector(`[data-count-for="${status}"]`);
    if (count) count.textContent = pool.filter((run) => run.status === status).length;
  }
  const total = runsCache.length;
  $("side-count").textContent = total ? (filtersActive() ? `${visibleRuns().length} of ${total}` : `${total}`) : "";
  $("filters-reset").hidden = !filtersActive();
}

function resetFilters() {
  filters.statuses = [...STATUS_FILTERS];
  filters.launched = "all";
  store.save("cwf-run-filters", filters);
  buildFilterBar();
  renderRunsList();
}

function togglePin(runId) {
  pins = pins.includes(runId) ? pins.filter((id) => id !== runId) : [runId, ...pins];
  store.save("cwf-run-pins", pins);
  renderRunsList();
}

async function fetchJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error ?? response.statusText);
  return response.json();
}

function deriveAgents(journal) {
  const byKey = new Map();
  for (const event of journal) {
    if (event.type === "agent.queued") {
      byKey.set(event.key, {
        key: event.key,
        label: event.label ?? event.key,
        phase: event.phase ?? "default",
        sequence: event.sequence,
        status: "queued",
        goal: event.goal === true,
        queuedAt: event.at,
        options: event.options ?? {},
        transcript: event.transcriptPath?.split("/").pop(),
        worktreePath: event.worktreePath,
      });
    } else if (event.type === "agent.started") {
      const queued = byKey.get(event.key);
      byKey.set(event.key, {
        key: event.key,
        label: event.label ?? queued?.label ?? event.key,
        phase: event.phase ?? queued?.phase ?? "default",
        sequence: event.sequence ?? queued?.sequence,
        status: "running",
        goal: event.goal === true || queued?.goal === true,
        queuedAt: event.queuedAt ?? queued?.queuedAt,
        startedAt: event.at,
        queueMs: event.queueMs,
        options: event.options ?? queued?.options ?? {},
        transcript: event.transcriptPath?.split("/").pop() ?? queued?.transcript,
        worktreePath: event.worktreePath ?? queued?.worktreePath,
      });
    } else if (event.type === "agent.completed" || event.type === "agent.failed") {
      const row = byKey.get(event.key) ?? {
        key: event.key,
        label: event.label ?? event.key,
        phase: event.phase ?? "default",
        sequence: event.sequence,
        options: event.options ?? {},
      };
      row.status = event.type === "agent.completed" ? "completed" : "failed";
      row.endedAt = event.at;
      row.queuedAt = event.queuedAt ?? row.queuedAt;
      row.startedAt = event.startedAt ?? row.startedAt;
      row.queueMs = event.queueMs ?? row.queueMs;
      row.executionMs = event.executionMs;
      row.usage = event.usage;
      row.error = event.error?.message;
      row.goal = event.goal === true || row.goal === true;
      row.worktreePath = event.worktreePath ?? row.worktreePath;
      row.worktreeKept = event.worktreeKept;
      row.transcript = row.transcript ?? event.transcriptPath?.split("/").pop();
      byKey.set(event.key, row);
    } else if (event.type === "agent.cached") {
      const prior = byKey.get(event.key);
      byKey.set(event.key, {
        key: event.key,
        label: prior?.label ?? event.label ?? event.key,
        phase: prior?.phase ?? event.phase ?? "cached",
        sequence: event.sequence ?? prior?.sequence,
        status: "cached",
        goal: event.goal === true || prior?.goal === true,
        startedAt: event.at,
        endedAt: event.at,
        options: prior?.options ?? event.options ?? {},
        usage: prior?.usage,
        transcript: prior?.transcript,
        worktreePath: event.worktreePath,
        worktreeKept: event.worktreeKept,
      });
    }
  }
  return [...byKey.values()];
}

function plannedPhases(run) {
  return (run.meta?.phases ?? []).map((phase) => typeof phase === "string" ? { title: phase } : phase).filter((phase) => phase?.title);
}

function phaseGroups(agents, run = {}, journal = []) {
  const order = [];
  const details = new Map();
  const add = (name, detail) => {
    if (!name) return;
    if (!details.has(name)) order.push(name);
    details.set(name, detail ?? details.get(name) ?? "");
  };
  for (const phase of plannedPhases(run)) add(phase.title, phase.detail);
  for (const event of journal) if (event.type === "phase") add(event.name, event.detail);
  for (const agent of [...agents].sort((left, right) =>
    (left.sequence ?? Number.MAX_SAFE_INTEGER) - (right.sequence ?? Number.MAX_SAFE_INTEGER)
    || String(left.startedAt ?? "").localeCompare(String(right.startedAt ?? "")))) add(agent.phase);

  const byPhase = new Map(order.map((phase) => [phase, []]));
  for (const agent of agents) {
    if (!byPhase.has(agent.phase)) byPhase.set(agent.phase, []);
    byPhase.get(agent.phase).push(agent);
  }
  for (const members of byPhase.values()) {
    members.sort((left, right) =>
      (left.sequence ?? Number.MAX_SAFE_INTEGER) - (right.sequence ?? Number.MAX_SAFE_INTEGER)
      || String(left.startedAt ?? "").localeCompare(String(right.startedAt ?? "")));
  }
  return [...byPhase.entries()].map(([phase, members]) => ({ phase, detail: details.get(phase), members }));
}

function maxConcurrency(members, now) {
  const points = [];
  for (const member of members) {
    if (!member.startedAt) continue;
    points.push([+new Date(member.startedAt), 1]);
    points.push([+new Date(member.endedAt ?? now), -1]);
  }
  points.sort((left, right) => left[0] - right[0] || left[1] - right[1]);
  let current = 0;
  let maximum = 0;
  for (const [, delta] of points) {
    current += delta;
    maximum = Math.max(maximum, current);
  }
  return maximum;
}

function phaseMode(members) {
  if (members.length < 2) return "";
  const maximum = maxConcurrency(members, Date.now());
  return maximum > 1 ? `${maximum}× parallel` : "sequential";
}

function phaseStatus(members) {
  if (!members.length) return "pending";
  if (members.some((member) => member.status === "failed")) return "failed";
  if (members.some((member) => member.status === "running")) return "running";
  if (members.some((member) => member.status === "queued")) return "queued";
  if (members.every((member) => member.status === "cached")) return "cached";
  if (members.every((member) => member.status === "completed" || member.status === "cached")) return "completed";
  return "pending";
}

// Extrapolates from this run's own throughput instead of any fixed per-agent
// guess, so a fan-out of slow xhigh agents and a pipeline of quick ones each
// calibrate themselves — wall-clock per finished agent already has the run's
// real concurrency baked in.
//
// Cached steps are excluded from both sides of the ratio: a replay finishes in
// ~0ms and would otherwise predict that everything left is nearly free.
//
// This only covers work already requested. A script that loops until a target
// is met can always queue more, so the estimate is a floor, not a promise.
function estimateRemaining(run, agents, now) {
  if (displayRunStatus(run) !== "running") return null;
  const completed = agents.filter((agent) => agent.status === "completed").length;
  const settled = agents.filter((agent) => agent.status === "completed" || agent.status === "cached").length;
  const total = Math.max(run.stats?.requested ?? 0, agents.length);
  const remaining = total - settled;
  // Under three finished agents the ratio is dominated by whichever one landed
  // first, which reads as confident nonsense.
  if (completed < 3 || remaining <= 0) return null;
  const elapsed = now - +new Date(run.startedAt);
  if (!(elapsed > 0)) return null;
  return { remainingMs: Math.round((elapsed / completed) * remaining), completed, remaining };
}

function agentTone(agent) {
  let value = 0;
  for (const character of `${agent.options.agentType ?? ""}${agent.options.model ?? ""}${agent.key}`) value = (value * 31 + character.charCodeAt(0)) >>> 0;
  return value % 5;
}

// Only non-zero counts earn a slot — "1✓ 0× 0↻ 0 queued" spent four columns
// saying one thing.
function runStats(run) {
  if (!run.stats) return "";
  const parts = [
    run.stats.completed ? `<span class="done">${run.stats.completed} done</span>` : "",
    run.stats.failed ? `<span class="failed">${run.stats.failed} failed</span>` : "",
    run.stats.cached ? `<span class="cached">${run.stats.cached} cached</span>` : "",
    run.stats.queued ? `<span>${run.stats.queued} queued</span>` : "",
  ].filter(Boolean);
  if (!parts.length && run.stats.requested) {
    parts.push(`<span>${run.stats.requested} agent${run.stats.requested === 1 ? "" : "s"}</span>`);
  }
  return parts.join("");
}

function runItem(run) {
  const live = run.status === "running" ? activeAgents.filter((agent) => agent.runId === run.runId) : [];
  const displayStatus = displayRunStatus(run);
  const pinned = pins.includes(run.runId);
  const selected = run.runId === selectedRunId;
  const name = run.name ?? run.runId;
  return `
    <div class="run-item ${selected ? "selected" : ""}">
      <button class="run-main" type="button" data-run="${esc(run.runId)}" ${selected ? 'aria-current="true"' : ""}
          title="${esc(name)} — ${esc(run.runId)}">
        <span class="run-title">
          <span class="dot ${esc(displayStatus)}" aria-hidden="true"></span>
          <span class="run-name">${esc(name)}</span>
        </span>
        <span class="run-meta">
          ${pill(displayStatus)}
          <span class="run-time">${fmtTime(run.startedAt)}</span>
          <span class="run-stats">${runStats(run)}</span>
        </span>
        ${live.map((agent) => `<span class="run-live" title="${esc(agent.activity?.text ?? agent.key)}">
          <span class="dot ${esc(agent.status)}" aria-hidden="true"></span>
          <span class="run-live-label">${esc(agent.label)}</span>
          <span class="run-live-doing">${esc(agent.status === "queued" ? "waiting to execute" : nowLine(agent.activity))}</span>
        </span>`).join("")}
      </button>
      <button class="run-pin" type="button" data-pin="${esc(run.runId)}" aria-pressed="${pinned}"
          title="${pinned ? "Unpin" : "Pin"} run" aria-label="${pinned ? "Unpin" : "Pin"} ${esc(name)}">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 2.75A.75.75 0 0 1 3.75 2h8.5a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-1.154.632L8 11.4l-3.846 2.482A.75.75 0 0 1 3 13.25V2.75Z"/></svg>
        <span class="hit" aria-hidden="true"></span>
      </button>
    </div>`;
}

function renderRunsList() {
  const pinSet = new Set(pins);
  const visible = visibleRuns();
  const pinned = visible.filter((run) => pinSet.has(run.runId));
  const unpinned = visible.filter((run) => !pinSet.has(run.runId));
  const running = unpinned.filter((run) => run.status === "running");
  const rest = unpinned.filter((run) => run.status !== "running");
  $("runs").innerHTML = [
    pinned.length ? `<div class="side-h">Pinned</div>${pinned.map(runItem).join("")}` : "",
    running.length ? `<div class="side-h">Running</div>${running.map(runItem).join("")}` : "",
    rest.length ? `<div class="side-h">${pinned.length || running.length ? "History" : "Runs"}</div>${rest.map(runItem).join("")}` : "",
  ].join("") || (runsCache.length
    ? `<div class="empty">No runs match these filters.<br /><button class="text-button" type="button" data-clear-filters>Clear filters</button></div>`
    : `<div class="empty">No runs yet.</div>`);
  updateFilterBar();
}

function computeStructureKey(run, agents, journal) {
  return [
    run.runId,
    run.status,
    run.ownerResponsive,
    run.attempt,
    run.worktrees?.length ?? 0,
    run.result == null ? 0 : 1,
    JSON.stringify(plannedPhases(run)),
    journal.filter((event) => event.type === "phase").map((event) => event.name).join("|"),
    agents.map((agent) => `${agent.key}:${agent.phase}:${agent.status}:${agent.goal ? "goal" : ""}`).join("|"),
  ].join("§");
}

function agentDisplay(agent) {
  if (agent.options.agentType) return `@${agent.options.agentType}`;
  if (agent.options.model) return agent.options.model;
  return "agent";
}

function goalBadge(agent) {
  if (!agent.goal) return "";
  const label = {
    queued: "goal queued",
    running: "goal active",
    completed: "goal met",
    failed: "goal failed",
    cached: "goal replayed",
  }[agent.status] ?? "goal";
  return `<span class="goal-badge">${esc(label)}</span>`;
}

function agentNode(agent) {
  const transcriptReady = agent.status !== "queued" && agent.transcript;
  const tags = [
    agent.options.effort ? { text: agent.options.effort, kind: "effort" } : null,
    agent.options.sandbox ? { text: agent.options.sandbox, kind: "" } : null,
    agent.worktreePath ? { text: `worktree${agent.worktreeKept ? " · kept" : ""}`, kind: "worktree" } : null,
    agent.queueMs > 0 ? { text: `queued ${fmtDur(agent.queueMs)}`, kind: "" } : null,
  ].filter(Boolean);
  return `<button class="agent-node ${esc(agent.status)}${agent.goal ? " goal" : ""}" type="button"
      data-node="${esc(agent.key)}" data-status="${esc(agent.status)}" data-card="${esc(agent.key)}"
      data-transcript="${esc(agent.transcript ?? "")}" data-label="${esc(agent.label)}"
      ${transcriptReady ? "" : "disabled"} title="${esc(transcriptReady ? `Open ${agent.label} transcript` : agent.label)}">
    <span class="agent-node-main" data-status="${esc(agent.status)}">
      <span class="node-status ${esc(agent.status)}" aria-hidden="true">${STATUS_ICON[agent.status] ?? ""}</span>
      <span class="sr-only">${esc(agent.status)}</span>
      <span class="node-label">${esc(agent.label)}</span>
      ${goalBadge(agent)}
    </span>
    <span class="node-meta">
      <span class="agent-orb tone-${agentTone(agent)}" aria-hidden="true"></span>
      <span class="node-owner-label">${esc(agentDisplay(agent))}</span>
      <span class="node-duration" data-dur></span>
    </span>
    ${tags.length ? `<span class="node-tags">${tags.map((tag) => `<span class="node-tag ${tag.kind}">${esc(tag.text)}</span>`).join("")}</span>` : ""}
    <span class="node-activity" data-now></span>
    ${agent.error ? `<span class="node-error" title="${esc(agent.error)}">${esc(agent.error)}</span>` : ""}
  </button>`;
}

function phaseColumn(group, index) {
  const status = phaseStatus(group.members);
  const mode = phaseMode(group.members);
  return `<section class="phase-column" id="phase-${slugify(group.phase)}-${index}" role="listitem" data-status="${status}">
    <div class="phase-heading" title="${esc(group.detail ?? group.phase)}">
      <span class="phase-index">${String(index + 1).padStart(2, "0")}</span>
      <span class="phase-name">${esc(group.phase)}</span>
      <span class="phase-count">${group.members.length}</span>
      ${mode ? `<span class="phase-mode">${mode}</span>` : ""}
    </div>
    <div class="phase-hub" aria-hidden="true"></div>
    <div class="phase-nodes">${group.members.map(agentNode).join("") || `<div class="phase-empty">Waiting for agents</div>`}</div>
  </section>`;
}

function progressTrack(agents, total) {
  const statuses = agents.map((agent) => agent.status);
  while (statuses.length < total) statuses.push("pending");
  const visible = statuses.slice(0, 40);
  return `${visible.map((status, index) => `<span class="seg ${esc(status)}" title="Step ${index + 1}: ${esc(status)}"></span>`).join("")}${statuses.length > visible.length ? `<span class="progress-more">+${statuses.length - visible.length}</span>` : ""}`;
}

function renderSkeleton(run, agents, journal) {
  const groups = phaseGroups(agents, run, journal);
  if (!groups.length) groups.push({ phase: run.phase ?? "Workflow", detail: "", members: [] });
  const total = Math.max(run.stats?.requested ?? 0, agents.length);
  const done = agents.filter((agent) => agent.status === "completed" || agent.status === "cached").length;

    run.result !== undefined && run.result !== null ? `<details class="support-panel wide" id="run-result"><summary>Result</summary><pre class="result mono">${esc(JSON.stringify(run.result, null, 2))}</pre></details>` : "",
  ].filter(Boolean).join("");

  // Authored by whoever wrote the workflow, via `meta.creator`. Absent is the
  // normal case for older runs — show nothing rather than invent an attribution.
  const creator = typeof run.meta?.creator === "string" ? run.meta.creator.trim() : "";
  $("main").innerHTML = `<div class="workflow-shell">
    <article class="workflow-card">
      <header class="workflow-titlebar">
        <svg class="workflow-symbol" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M8 .8 15.2 8 8 15.2.8 8 8 .8Zm0 3.02L3.82 8 8 12.18 12.18 8 8 3.82Z"/></svg>
        <div class="workflow-heading">
          <h2>
            <span class="workflow-title">${esc(run.name ?? run.runId)}</span>
            <span class="workflow-attempt">#${run.attempt ?? 1}</span>

          ${run.description ? `<p class="workflow-description">${esc(run.description)}</p>` : ""}
        </div>
        <button class="icon-button titlebar-focus" type="button" data-flow-focus aria-label="Jump to active step" title="Jump to active step">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4.75A2.75 2.75 0 0 1 4.75 2h1a.75.75 0 0 1 0 1.5h-1c-.69 0-1.25.56-1.25 1.25v1a.75.75 0 0 1-1.5 0v-1Zm8.5-2A.75.75 0 0 1 11.25 2h1A2.75 2.75 0 0 1 15 4.75v1a.75.75 0 0 1-1.5 0v-1c0-.69-.56-1.25-1.25-1.25h-1a.75.75 0 0 1-.75-.75ZM2.75 9.5a.75.75 0 0 1 .75.75v1c0 .69.56 1.25 1.25 1.25h1a.75.75 0 0 1 0 1.5h-1A2.75 2.75 0 0 1 2 11.25v-1a.75.75 0 0 1 .75-.75Zm11.5 0a.75.75 0 0 1 .75.75v1A2.75 2.75 0 0 1 12.25 14h-1a.75.75 0 0 1 0-1.5h1c.69 0 1.25-.56 1.25-1.25v-1a.75.75 0 0 1 .75-.75ZM8 6a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
        </button>
        ${creator ? `<div class="workflow-owner">
          <span class="label">Creator</span>
          <span class="owner-monogram" aria-hidden="true">${esc(creator.slice(0, 1).toUpperCase())}</span>
          <span class="owner-name">${esc(creator)}</span>
        </div>` : ""}
      </header>
      ${run.error ? `<div class="workflow-error"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 7.5a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8Z"/></svg><span>${esc(run.error.message)}</span></div>` : ""}
      ${runStatus === "stalled" ? `<div class="workflow-error"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 7.5a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8Z"/></svg><span>The workflow owner has not updated its heartbeat for ${esc(fmtDur(run.heartbeatAgeMs))}.</span></div>` : ""}
      <div class="flow-viewport" id="flow-viewport">
        <div class="flow-stage" id="flow-stage" style="--phase-count:${groups.length};--stage-width:${stageWidth}px">
          <svg class="flow-edges" id="flow-edges" aria-hidden="true"></svg>

        </div>

          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4.75A2.75 2.75 0 0 1 4.75 2h1a.75.75 0 0 1 0 1.5h-1c-.69 0-1.25.56-1.25 1.25v1a.75.75 0 0 1-1.5 0v-1Zm8.5-2A.75.75 0 0 1 11.25 2h1A2.75 2.75 0 0 1 15 4.75v1a.75.75 0 0 1-1.5 0v-1c0-.69-.56-1.25-1.25-1.25h-1a.75.75 0 0 1-.75-.75ZM2.75 9.5a.75.75 0 0 1 .75.75v1c0 .69.56 1.25 1.25 1.25h1a.75.75 0 0 1 0 1.5h-1A2.75 2.75 0 0 1 2 11.25v-1a.75.75 0 0 1 .75-.75Zm11.5 0a.75.75 0 0 1 .75.75v1A2.75 2.75 0 0 1 12.25 14h-1a.75.75 0 0 1 0-1.5h1c.69 0 1.25-.56 1.25-1.25v-1a.75.75 0 0 1 .75-.75ZM8 6a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
        </button>

        <span class="progress-label">Progress</span>

        <span class="progress-summary">
          <span><strong id="progress-count">${done}</strong>/${total || 0}</span>
          <span id="elapsed"></span>
          <span class="progress-eta" id="eta"></span>
          <span id="token-count">–</span>
        </span>
      </footer>
